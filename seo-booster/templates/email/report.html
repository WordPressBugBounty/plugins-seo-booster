<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns:v="urn:schemas-microsoft-com:vml">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width; initial-scale=1.0; maximum-scale=1.0;" />
    <meta name="viewport" content="width=600,initial-scale = 2.3,user-scalable=no">
    <title>%%emailtitle%%</title>
    <style type="text/css">
        body {
            width: 100%;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            mso-margin-top-alt: 0px;
            mso-margin-bottom-alt: 0px;
            mso-padding-alt: 0px 0px 0px 0px
        }

        /*
        p,
        h1,
        h2,
        h3,
        h4 {
            margin-top: 0;
            margin-bottom: 0;
            padding-top: 0;
            padding-bottom: 0
        }
*/
        span.preheader {
            display: none;
            font-size: 1px
        }

        html {
            width: 100%
        }

        table {
            font-size: 14px;
            border: 0
        }

        @media only screen and (max-width: 640px) {
            .main-header {
                font-size: 20px !important
            }

            .main-section-header {
                font-size: 28px !important
            }

            .show {
                display: block !important
            }

            .hide {
                display: none !important
            }

            .align-center {
                text-align: center !important
            }

            .no-bg {
                background: none !important
            }




            .container590 {
                width: 440px !important
            }

            .container580 {
                width: 400px !important
            }

            .main-button {
                width: 220px !important
            }

        }

        @media only screen and (max-width: 479px) {
            .main-header {
                font-size: 18px !important
            }

            .main-section-header {
                font-size: 26px !important
            }

            .container590 {
                width: 280px !important
            }

            .container590 {
                width: 280px !important
            }

            .container580 {
                width: 260px !important
            }

        }
    </style>

        body {
        font-family: arial, sans-serif!important;
        }
        </style>
      <![endif]-->
</head>

<body class="respond" leftmargin="0" topmargin="0" marginwidth="0" marginheight="0">
    <table style="display:none!important;">
        <tr>
            <td>
                <div style="overflow:hidden;display:none;font-size:1px;color:#ffffff;line-height:1px;font-family:Arial;max-height:0px;max-width:0px;opacity:0;">
                    SEO Booster update for <span style="color: #2473b1;">%%websitedomain%%</span>
                </div>
            </td>
        </tr>
    </table>
    <table border="0" width="100%" cellpadding="0" cellspacing="0" bgcolor="ffffff">
        <tr>
            <td align="center">
                <table border="0" align="center" width="590" cellpadding="0" cellspacing="0" class="container590">
                    <tr>
                        <td height="25" style="font-size: 25px; line-height: 25px;">&nbsp;</td>
                    </tr>
                    <tr>
                        <td align="center">
                        </td>
                    </tr>
                    <tr>
                        <td height="25" style="font-size: 25px; line-height: 25px;">&nbsp;</td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
    <table border="0" width="100%" cellpadding="0" cellspacing="0" bgcolor="ffffff" class="bg_color">
        <tr>
            <td align="center">
                <table border="0" align="center" width="590" cellpadding="0" cellspacing="0" class="container590">
                    <tr>
                        <td style="color: #343434; font-size: 24px; font-family: helvetica, arial, sans-serif; font-weight:700; line-height: 35px;" class="main-header">
                            <!-- section text ======-->
                            <div style="line-height: 35px">
                                SEO Booster Update for <span style="color: #2473b1;">%%websitedomain%%</span>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td height="10" style="font-size: 10px; line-height: 10px;">&nbsp;</td>
                    </tr>
                    <tr>
                        <td align="center">
                            <table border="0" width="40" align="center" cellpadding="0" cellspacing="0" bgcolor="eeeeee">
                                <tr>
                                    <td height="2" style="font-size: 2px; line-height: 2px;">&nbsp;</td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td height="20" style="font-size: 20px; line-height: 20px;">&nbsp;</td>
                    </tr>
                    <tr>
                        <td align="left">
                            <table border="0" width="590" align="center" cellpadding="0" cellspacing="0" class="container590">
                                <tr>
                                    <td align="left" style="color: #282828; font-size: 16px; font-family: Helvetica, Arial, sans-serif; line-height: 24px;">
                                        <!-- section text ======-->
                                        <p style="line-height: 24px;margin-bottom:15px;">
                                            %%emailintrotext%%
                                        </p>
                                        <p style="line-height: 24px; margin-bottom:20px;">
                                            %%emailcontent%%
                                        </p>
                                        <p><a href="%%dashboardlink%%" style="color: #ffffff; text-decoration: none;">%%dashboardlinkanchor%%</a></p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr>
            <td height="40" style="font-size: 40px; line-height: 40px;">&nbsp;</td>
        </tr>
    </table>
    <table border="0" width="100%" cellpadding="0" cellspacing="0" bgcolor="ffffff" class="bg_color">
        <tr>
            <td height="60" style="font-size: 60px; line-height: 60px;">&nbsp;</td>
        </tr>
        <tr>
            <td align="center">
                <table border="0" align="center" width="590" cellpadding="0" cellspacing="0" class="container590 bg_color">
                    <tr>
                        <td>
                            <table border="0" width="300" align="left" cellpadding="0" cellspacing="0" style="border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt;" class="container590">
                                <tr>
                                    <td align="left" style="color: #888888; font-size: 14px; font-family: Helvetica, Arial, sans-serif; line-height: 23px;" class="text_color">
                                        <div style="color: #333333; font-size: 14px; font-family: Helvetica, Arial, sans-serif; font-weight: 600; mso-line-height-rule: exactly; line-height: 23px;">
                                            <p>Thank you for using <a href="https://seoboosterpro.com/" target="_blank" rel="noopener">SEO Booster</a> by <a href="https://seoboosterpro.com/" target="_blank" rel="noopener">SEO Booster Pro</a><p>
                                        </div>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr>
            <td height="60" style="font-size: 60px; line-height: 60px;">&nbsp;</td>
        </tr>
    </table>
    <!-- footer -->
    <table border="0" width="100%" cellpadding="0" cellspacing="0">
        <tr>
            <td height="25" style="font-size: 25px; line-height: 25px;">&nbsp;</td>
        </tr>
        <tr>
            <td align="center">
                <table border="0" align="center" width="590" cellpadding="0" cellspacing="0" class="container590">
                    <tr>
                        <td>
                            <table border="0" align="left" cellpadding="0" cellspacing="0" style="border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt;" class="container590">
                                <tr>
                                    <td align="left" style="color: #aaaaaa; font-size: 14px; font-family: Helvetica, Arial, sans-serif; line-height: 24px;">
                                        <div style="line-height: 24px;">
                                            <span style="color: #333333;font-size:.8em;">Template based on Abacus, an <a href="https://templates.emailoctopus.com/" target="_blank" rel="noopener">EmailOctopus template</a></span>
                                        </div>
                                    </td>
                                </tr>
                            </table>
                            <table border="0" align="left" width="5" cellpadding="0" cellspacing="0" style="border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt;" class="container590">
                                <tr>
                                    <td height="20" width="5" style="font-size: 20px; line-height: 20px;">&nbsp;</td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr>
            <td height="25" style="font-size: 25px; line-height: 25px;">&nbsp;</td>
        </tr>
    </table>
    <!-- end footer ======-->
</body>

</html>
